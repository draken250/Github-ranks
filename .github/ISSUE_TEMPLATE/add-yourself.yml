name: Add me to the leaderboard
description: Ask a maintainer to add your GitHub username to the directory (or better, open a PR yourself — see CONTRIBUTING.md)
title: "Add: <your-github-username>"
labels: ["directory"]
body:
  - type: markdown
    attributes:
      value: |
        You can also add yourself directly via a pull request in under a minute —
        see [CONTRIBUTING.md](../../CONTRIBUTING.md#add-yourself-to-the-leaderboard).
        Use this issue only if you'd rather someone else make the edit.
  - type: input
    id: username
    attributes:
      label: GitHub username
      placeholder: octocat
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
      placeholder: United States
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region / State (optional)
    validations:
      required: false
  - type: input
    id: city
    attributes:
      label: City (optional)
    validations:
      required: false
